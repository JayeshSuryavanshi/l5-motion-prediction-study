[project]
name = "l5study"
version = "0.1.0"
description = "Motion prediction on the Lyft Level 5 dataset under a strict single-laptop compute budget"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jayesh Suryavanshi" }]
dependencies = [
    "numpy==1.26.4",
    "zarr>=2.17,<3",
    "protobuf==3.20.3",
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
    "opencv-contrib-python-headless>=4.9",
    "pymap3d>=3",
    "scipy>=1.11",
    "transforms3d>=0.4",
    "shapely>=2",
    "pyyaml>=6",
    "tqdm>=4.66",
    "prettytable>=3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "kaggle>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l5study"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/download_subset.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
